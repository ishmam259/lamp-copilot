<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>LaMP · Carton & Strip</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;font-family:Barlow,system-ui,sans-serif;background:#fff;color:#222;overflow:hidden;font-variant-numeric:tabular-nums}
.bar{height:10px;background:linear-gradient(90deg,#1E5BB8 0 60%,#E8483B 60% 80%,#2E9E5B 80%)}
header{padding:16px 18px;border-bottom:1px solid #E6E6E6;display:flex;justify-content:space-between;align-items:baseline}
.brand{font:800 24px Barlow;color:#1E5BB8}.shop{font-size:14px;color:#666}
.card{margin:16px 18px 0;border:1px solid #E6E6E6;border-radius:4px;overflow:hidden}
.band{padding:8px 14px;color:#fff;font:700 13px Barlow;letter-spacing:1.2px}
.b1{background:#E8483B}.b2{background:#1E5BB8}.b3{background:#2E9E5B}
.body{padding:14px}
.big{font:800 30px Barlow}
.stamp{display:inline-block;font:700 14px "Courier Prime";color:#3A3A3A;border:1px dashed #9A9A9A;padding:3px 8px;margin-top:8px}
.r{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #F0F0F0;font-size:15px}
.r:first-child{border-top:0}
.btn{display:block;margin:16px 18px 0;text-align:center;background:#1E5BB8;color:#fff;font:700 16px Barlow;padding:13px;border-radius:4px}
</style></head><body>
<div class="bar"></div>
<header><span class="brand">LaMP</span><span class="shop">Green Life Pharmacy</span></header>
<div class="card"><div class="band b1">CASH ALERT</div><div class="body"><div class="big">Short BDT 19,000</div><div>Supplier A order, BDT 60,000</div><span class="stamp">DUE 26/10/26</span></div></div>
<div class="card"><div class="band b2">NEXT PAYMENTS</div><div class="body">
<div class="r"><span>Supplier D</span><span>8,450 · <b>18/10</b></span></div>
<div class="r"><span>Supplier A</span><span>60,000 · <b>26/10</b></span></div>
<div class="r"><span>Shop rent</span><span>18,000 · <b>01/11</b></span></div></div></div>
<div class="card"><div class="band b3">EXPIRING STOCK</div><div class="body"><div class="big" style="font-size:24px">BDT 18,400</div><span class="stamp">EXP ≤ 15/12/26 · 6 BATCHES</span></div></div>
<a class="btn">See the fix</a>
</body></html>
