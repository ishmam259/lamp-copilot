[project]
name = "lamp-copilot-backend"
version = "0.1.0"
description = "LaMP-Copilot API: deterministic engines and REST endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "scipy>=1.13",
    "openai>=1.60",
    "pillow>=10.4",
    "pydantic-ai-slim[openai]>=2.57",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
